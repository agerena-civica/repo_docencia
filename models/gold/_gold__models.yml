version: 2

models:
  - name: fct_orders
    description: Hechos de pedidos (capa Gold).
    columns:
      - name: order_id
        description: Clave primaria del hecho.
        data_tests:
          - unique:
              config:
                severity: warn
                warn_if: ">0"
                error_if: ">100"
                store_failures: true
          - not_null